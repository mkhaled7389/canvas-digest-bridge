<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head><body>
<header class="topbar"><div><p class="eyebrow">ASU CANVAS</p><h1>Canvas Compass</h1></div><img class="brand-icon" src="logo.svg" alt=""></header>
<section class="status-card" id="statusCard"><div class="status-row"><span class="status-dot"></span><p id="state">Checking…</p></div><p id="identity" class="identity"></p><div id="connections" class="connection-list" aria-label="Connection status"></div><p id="detail" role="status"></p><div class="actions"><button id="check" class="secondary">Check</button><button id="snapshot" class="primary">Refresh</button><button id="export" class="secondary">Export</button></div></section>
<section class="deadlines"><div class="section-heading"><div><p class="eyebrow">SAVED CANVAS SNAPSHOT</p><h2>What’s coming up</h2></div><span id="deadlineCount" class="count">—</span></div><details class="filters"><summary>Courses &amp; deadlines</summary><label>Show<select id="deadlineFilter"><option value="upcoming">Upcoming</option><option value="48h">Next 48 hours</option><option value="7d">Next 7 days</option><option value="overdue">Overdue — completion unverified</option><option value="completed">Submitted / excused</option></select></label><fieldset id="courseFilters"><legend>Included courses</legend></fieldset><button id="allCourses" class="text-button">Select all courses</button><p class="settings-copy">Filters affect this view only. Exports retain the full snapshot.</p></details><p id="viewSummary" class="settings-copy" aria-live="polite"></p><ol id="assignments"><li class="empty">Refresh to view current items.</li></ol></section>
<footer><button id="open" class="text-button">Open Canvas ↗</button><button id="settings" class="text-button">Settings</button><span>Read-only</span></footer>
<script type="module" src="popup.js"></script>
</body></html>
