<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head><body>
<header class="topbar"><div><p class="eyebrow">ASU CANVAS</p><h1>Digest Bridge</h1></div><span class="orb" aria-hidden="true"></span></header>
<section class="status-card" id="statusCard"><div class="status-row"><span class="status-dot"></span><p id="state">Checking Canvas…</p></div><p id="detail">Enable monitoring in Settings to begin.</p><div class="actions"><button id="check" class="secondary">Check session</button><button id="snapshot" class="primary">Refresh assignments</button><button id="export" class="secondary">Export snapshot</button></div></section>
<section class="deadlines"><div class="section-heading"><div><p class="eyebrow">SAVED CANVAS SNAPSHOT</p><h2>What’s coming up</h2></div><span id="deadlineCount" class="count">—</span></div><details class="filters"><summary>Courses &amp; deadlines</summary><label>Show<select id="deadlineFilter"><option value="upcoming">Upcoming</option><option value="48h">Next 48 hours</option><option value="7d">Next 7 days</option><option value="overdue">Overdue — completion unverified</option><option value="completed">Submitted / excused</option></select></label><fieldset id="courseFilters"><legend>Included courses</legend></fieldset><button id="allCourses" class="text-button">Select all courses</button><p class="settings-copy">Filters affect this view only. Exports retain the full snapshot.</p></details><p id="viewSummary" class="settings-copy" aria-live="polite"></p><ol id="assignments"><li class="empty">Refresh assignments to view current items.</li></ol></section>
<footer><button id="open" class="text-button">Open Canvas ↗</button><button id="settings" class="text-button">Settings</button><span>Read-only</span></footer>
<script type="module" src="popup.js"></script>
</body></html>
